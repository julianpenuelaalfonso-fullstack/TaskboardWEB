# Blueprint de Render: recrea la base de datos, la API y el frontend con un clic.
databases:
  - name: taskboard-db
    plan: free

services:
  - type: web
    name: taskboard-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: taskboard-db
          property: connectionString
      - key: DB_SSL
        value: "false"
      - key: FRONTEND_URL
        sync: false # URL del Static Site, se pide al crear el Blueprint

  - type: web
    name: taskboard-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # URL pública de la API, sin barra final
